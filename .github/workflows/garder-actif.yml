name: Garder le radar actif

# GitHub met en pause les tâches planifiées d'un dépôt sans activité depuis 60 jours.
# Un petit commit par mois suffit à l'éviter.
on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > derniere-activite.txt
          git config user.name "radar-alpes"
          git config user.email "radar-alpes@users.noreply.github.com"
          git add derniere-activite.txt
          git commit -m "Garder le radar actif" || true
          git push
