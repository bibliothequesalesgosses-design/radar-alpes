name: Radar MétéoSuisse

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      explorer:
        description: "Afficher le contenu du catalogue (dépannage)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python radar.py --sortie site ${{ inputs.explorer && '--explorer' || '' }}
      - if: ${{ inputs.explorer }}
        uses: actions/upload-artifact@v4
        with:
          name: apercu
          path: site
          retention-days: 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
