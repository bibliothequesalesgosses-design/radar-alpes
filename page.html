<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar Alpes · Bibliothèque des Sales Gosses</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body{margin:0;height:100%;font-family:Arial,sans-serif}#carte{position:absolute;inset:0}
#info{position:absolute;z-index:1000;left:10px;right:10px;bottom:18px;margin:auto;max-width:520px;background:rgba(11,28,51,.92);color:#e6edf5;border-radius:12px;padding:10px 14px;font-size:15px}
#info b{color:#f0a35e}#info small{color:#9fb3c8}</style></head>
<body><div id="carte"></div><div id="info">Chargement…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const carte = L.map("carte").setView([46.3, 7.5], 7);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 12, attribution: "© OpenStreetMap" }).addTo(carte);
fetch("radar.json?" + Date.now()).then(r => r.json()).then(d => {
  const c = d.coins, bornes = [[c[2][1], c[0][0]], [c[0][1], c[1][0]]];
  L.rectangle(bornes, { color: "#f0a35e", weight: 1, fill: false, dashArray: "4 4" }).addTo(carte);
  const calques = d.images.slice().reverse().map(i => ({ i, calque: L.imageOverlay(i.fichier + "?" + Date.now(), bornes, { opacity: 0 }).addTo(carte) }));
  let n = calques.length - 1;
  const montrer = () => {
    calques.forEach((x, k) => x.calque.setOpacity(k === n ? 0.85 : 0));
    const i = calques[n].i;
    document.getElementById("info").innerHTML = "<b>Radar " + new Date(i.heure).toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit" }) +
      "</b> · pluie max " + i.pluie_max + " mm/h<br><small>Animation de la dernière heure · Source : MétéoSuisse</small>";
  };
  montrer();
  setInterval(() => { n = (n + 1) % calques.length; montrer(); }, n === 0 ? 99999 : 900);
});
</script></body></html>
